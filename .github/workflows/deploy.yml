name: Build and Deploy CARD SCANNER

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

jobs:
  verify:
    name: Verify (typecheck, lint, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      owner_lowercase: ${{ steps.repo_owner.outputs.owner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Short Commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Convert Repo Owner to Lowercase (GHCR requirement)
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/card_scanner:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/card_scanner:${{ steps.vars.outputs.short_sha }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: self-hosted
    # Explicit, and the whole scope. Without a block this job inherits the
    # repository's default token permissions, which are invisible in this file.
    # It needs nothing: it does not check out the repo, and `docker compose
    # pull` authenticates to GHCR with the runner's own docker credentials
    # rather than with GITHUB_TOKEN. contents: read is the floor every job
    # declares so the value is uniform and never a silent repository default.
    permissions:
      contents: read
    steps:
      - name: Pull and Restart Container
        shell: powershell
        working-directory: D:/card-scanner
        env:
          APP_VERSION: ${{ needs.build-and-push.outputs.short_sha }}
        run: |
          $env:APP_VERSION = $env:APP_VERSION
          docker compose pull card_scanner
          docker compose up -d --no-deps card_scanner
          $repo = "ghcr.io/laser-power-infra/card_scanner"
          $allImages = docker images --filter "reference=$repo" --format "{{.ID}}" | Select-Object -Unique
          $oldImages = $allImages | Select-Object -Skip 2

          if ($oldImages) {
              Write-Host "Cleaning up old images: $oldImages"
              $oldImages | ForEach-Object { docker rmi -f $_ }
          } else {
              Write-Host "No old images to prune. Latest and previous images preserved."
          }
          docker image prune -f